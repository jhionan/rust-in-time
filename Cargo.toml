[package]
name = "rust-in-time"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Project-aware parallel time tracking for Windows"
license = "MIT"
repository = "https://github.com/jhionan/rust-in-time"

[lib]
name = "rust_in_time"

[[bin]]
name = "rit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
crossterm = "0.29"
dirs = "6"
fs2 = "0.4"
glob = "0.3"
humantime = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pdf-writer = "0.15"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.37"
ttf-parser = "0.25"
url = "2"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
